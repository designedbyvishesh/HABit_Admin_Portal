<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .back{
            position: fixed;
            left: 0;
            right: 0;
            top: 0;
            bottom: 0;
            background-color: rgba(0, 0, 0, 0.8);
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .sidebar{
            background: pink;
            position: fixed;
            right:0 ;
            bottom:0 ;
            top: 0;
        }
        p{
            margin:0px;
            font-family: Arial, Helvetica, sans-serif;
            margin-bottom: 6px;
        }
        .popup{
            position: fixed;
            padding: 12px;
            padding-right: 150px ;
            border-radius: 6px;
            background: white;
            
        }
        .title{
            font-size: 24px;
            margin-bottom: 6px;
            font-weight: 700;
        }
    </style>
</head>
<body>
    <div class="sidebar">
        Right sidebars
    </div>
    <div class="back">
        <div class="popup">
            <p class="title">Modal Title</p>
            <p class="about">This is modal</p>
            <button>Close</button>
        </div>
    </div>
</body>
</html>
