<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>youtube</title>
    <Style>
        /* video section */
        p{ 
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
             font-size: small;
            }
        .title{
            font-weight: 600;
            margin-top: 0px;
            margin-bottom: 4px;
        }
        .about{ 
            margin-top: 0px;
            font-size: 10px; color: rgb(55, 55, 55);
        }
        .video-content{
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            column-gap: 8px;
            row-gap: 18px;
        }
        .thumbnail_image{
            width: 100%;
        }
        .details{
            display: grid;
            grid-template-columns: 30px 1fr;
        }
        .description{
            margin-left: 8px;
        }
        .channel_image{
            width: 30px;
            height: 30px;
            object-fit: cover;
            border-radius: 15px;
        }
        /* Header */
        .top-bar{
            display: flex;
            flex-direction: row;
            justify-content: space-between;
            margin: 6px;
            align-items: center;
        }
        .mid{
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
            flex: 1;
            padding: 8px;
            font-size: 10px;
            margin-left: 70px;
            margin-right: 35px;
            max-width: 500px;
        }
        .right{
            background-color: beige;
            width:150px
        }
        .left{
            background-color: blanchedalmond;
            width: 200px;
        }
    </Style>
</head>
<body>
    <!-- Header -->
     <div class="top-bar">
        <div class="left">col1</div>
        <div>
            <input class="mid" type="text" placeholder="Search">
        </div>
        <div class="right">col3</div>
     </div>
    <!-- video section -->
    <div class="video-content">
        <div class="video">
            <div class="thumbnail"><img class="thumbnail_image" src="Youtube/Images/mindblow.jpeg"></div>
        <div class="details">
            <div class="logo">
                <img class="channel_image" src="Youtube/Images/mindblow.jpeg"> 
            </div>
            <div class="description">
                <p class="title">This this video title</p>

        </div>

</html>
