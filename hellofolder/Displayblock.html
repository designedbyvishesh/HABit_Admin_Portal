<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>displayblock</title>
    <style>
        .text{
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
            font-size: 32px;
            font-weight: 600;
            margin-top: 0px;
            margin-bottom: 16px;
        }
        .name,
        .email{
            width: 280px;
            padding-left: 16px;
            padding-top: 12px;
            background-color: rgb(234, 234, 234);
            border: none;
            padding-bottom: 10px;
            display: block;
            margin-bottom: 4px;
            color: gray;
        }
        button{
            margin-top: 24px;
            padding-left: 16px;
            padding-right: 16px;
            padding-top: 12px;
            background-color: rgb(0, 0, 0);
            border: none;
            padding-bottom: 10px;
            display: block;
            margin-right: 12px;
            color: rgb(255, 255, 255);
            display: inline-block;

            transition: 0.4s;
        }
        .butto:hover{
            background-color: rgb(234, 234, 234);
            color: black;
        }
        .button2{
            background-color: rgb(234, 234, 234);
            color: rgb(0, 0, 0);
        }
        .button2:hover{
            background-color: black;
            color: rgb(234, 234, 234);
        }
    </style>
</head>
<body>
    <p class="text">Request a ride now</p>
    <input class="name" type="text" placeholder="Enter pickup location">
    <input class="email" type="text" placeholder="Enter destination">
    <button class="butto">Request now</button>
    <button class="button2">Schedule for later</button>
</body>
</html>
