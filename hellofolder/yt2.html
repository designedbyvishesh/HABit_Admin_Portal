<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Youtube.com</title>
    <style>
        p {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            font-size: 10px;
            color: rgb(163, 163, 163);
        }
        .image{
            width: 100%;
        }
        .channel{
            width: 30px;
            height: 30px;   
            object-fit: cover;  
            border-radius: 15px;       
        }
        .video-info{
            margin-left: 4px;
        }
        .content{
            display: grid;
            grid-template-columns: 30px 1fr;
        }
        .title{
            font-size: 10px;  
            font-weight: bold;
            padding: 0;
            line-height: 14px;
            color: rgb(39, 39, 39);
            margin-bottom: 6px;
        }
        .video-content{
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            column-gap: 8px;
            row-gap: 18px;
        }
    </style>
</head>
<body>
    <div class="video-content">
        <div class="video">
            <div class="thumbnail">
                <img class="image" src="Youtube/Images/mindblow.jpeg" alt="youtube">
            </div>
            <div class="content">
                <div class="channel-image">
                    <img class="channel" src="Youtube/Images/mindblow.jpeg" alt="youtube">
                </div>
                <div class="video-info">
                <p class="title"> Talking tech and AL with google ceo sundar pichai</p> 
                <p> Marque Browniee</p> 
                <p> 3.4M views &#183 6 months ago</p> 
                </div>
            </div>
        </div>
        
    </div>
</body>
</html>
