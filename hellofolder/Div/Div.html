<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .con{
            border: solid;
            border-width: 1px;
            border-color: gray;
            display: inline-block;
            padding: 16px;
        }
        .text{
            margin-top: 0px;

        } 
        .YT{
            background-color: rgb(34, 34, 34);
            display: inline-block;
            padding: 16px;
            font-family: system-ui;
        }
        .t{
            color: white;
            font-weight: 600;
            font-size: 20px;
            margin: 0px;
        } 
        .e{
            color: gray;
            font-size: 12px;
            max-width: 250px;
            line-height: 14px;
            margin-top: 4px;
            margin-bottom: 4px;
        }
        .one{
            font-family: arial;
            vertical-align: top;
            margin-right: 12px;
            display: inline-block;
            box-shadow: 0px 0px 8px rgb(108, 108, 108);
        }
        .cat1{
            width: 200px;
            height: 200px;
            object-fit: cover;
            margin-bottom: 12px;
        }
        .text1{
            margin-top: 0px;
            margin-bottom: 0px;
            padding-left: 8px;
            font-size: 18px;
            font-family: system-ui;
            font-weight: 600;
        }
        .text2{
            margin-top: 0px;
            margin-bottom: 8px;
            padding-left: 8px;
            font-size: small;
            font-family: system-ui;
            color: gray;
        }
        .add{
            margin-left: 8px;
            margin-bottom: 10px;
            padding-left: 12px;
            border-radius: 4px;
            padding-right: 12px;
            padding-top: 8px;
            padding-bottom: 8px;
            border: none;
            font-size: 16px;
            color: white;
            background-color: rgb(71, 52, 240);
        }
        div{
            text-align: center;
        }
        .gc{
            height: 200px;
            margin-top: 10px;
            margin-bottom: 10px;
        }
        input{
            border: none;
            padding-top: 12px;
            padding-bottom: 8px;
            padding-left: 12px;
            padding-right: 16px;
            font-size: 16px;
            width: 500px;
            border-radius: 24px;
            box-shadow: 0px 1px 6px rgba(0,0,0,0.2);
            margin-bottom: 36px;
        }
        .box,.luck{
            background-color: rgb(185, 185, 185);
            padding-left: 12px;
            padding-top: 12px;
            padding-right: 12px;
            padding-bottom: 8px;
            font-size: 15px;
            border: none;
            margin-left: 24px;
        }
    </style>
</head>
<body>
    <div class="google">
        <img class="gc" src="google.jpg">
    </div>
    <div>
        <input class="Searchbox" type="text" placeholder="Search Google or type a URL">
    </div>
    <div>
        <button class="box">Google Search</button>
        <button class="luck">I'm Feeling Lucky</button>
    </div>
    <div class="con">
        <p class="text">Satisfied with our servies?</p>
        <button class="yes">Yes</button>
        <button>No</button>
    </div>
    <div class="YT">
        <p class="t">Install YouTube Music</p>
        <p class="e">Add YouTube Music to your desktop for quick and easy access</p>
    </div> 
    <div class="one">
        <img class="cat1" src="images.jpeg">
        <p class="text1"> Oliver</p>
        <p class="text2">2 mutual friends</p>
        <button class="add">Add Friend</button>
    </div>
    <div class="one">
        <img class="cat1" src="cat2.jpg">
        <p class="text1"> Oliver</p>
        <p class="text2">2 mutual friends</p>
        <button class="add">Add Friend</button>
    </div>
</body>
</html>
