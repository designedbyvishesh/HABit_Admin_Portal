<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    div{
        display: grid;
        grid-template-columns: 1fr 1fr 1fr 1fr;
        margin-bottom: 20px;
        margin-right: 20px;
    }
    .big{
        background-color: pink;
    }
    .Small{
        background-color: lightblue;
    }
    .medium{
        background-color: pink;
    }
</style>
<body>
    <div>
        <div class="big">col1</div>
        <div class="Small">col2</div>
        <div class="medium">col3</div>
        <div class="medium">col4</div>
        <div class="big">col1</div>
        <div class="Small">col2</div>
        <div class="medium">col3</div>
        <div class="medium">col4</div>
    </div>
</body>
</html>
