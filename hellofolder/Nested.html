<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat&family=Roboto:wght@400;500;700&family=Tangerine&display=swap" rel="stylesheet">
    <Style>
        p{
            font-family: roboto;
            font-size: 14px;
            color: rgb(39, 39, 39);
        }
        .video{
            margin-bottom: 12px;
        }
        .thumbnail{
            vertical-align: top;
            display: inline;
            margin-right: 6px;
        }
        .image{
            width: 180px;
            height: 100px;
            object-fit: cover;
        }
        .content{
            margin-top: 2px;
            display: inline-block;
            width: 200px;
        }
        p{
            font-size: 12px;
            color: rgb(160, 160, 160);
            margin: 0px;
        }
        .title{
            font-size: 14px;
            font-weight: bold;
            color: black;
            margin-bottom: 6px;
        }
    </Style>
        <body>
        <div class="video">
        <div class="thumbnail">
            <img class="image" src="mindblow.jpeg">
        </div>
        <div class="content">
                <p class="title">How to complete against CS degrees (as a self-taught dev)</p>
                <p>SuperSimpleDev</p>
                <p>1.5k views &#183 4 months ago</p>
        </div>
        </div>
</body>
</html>
