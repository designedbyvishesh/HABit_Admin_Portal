            align-items: center;
        }
        p{
            margin: 0;
            background-color: black;
            color:white;
        }
        </style>
</head>
<body>
    <div class="row">
        <div class="item1-div">
        </div>
        <div class="item2-div">
            <div class="r1">

        </div>
    </div>
