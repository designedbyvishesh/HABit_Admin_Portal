<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nested flexbox</title>
    <style>
        .row{
            display: flex;
            flex-direction: row;
        }
        .c1{
           /* display:flex;
           flex:1; */
           width: 350px;
           background-color: pink; 
        }
        .c2{
            display:flex;
            flex: 1;
            flex-direction: column;
            background-color: rgb(144, 144, 255);
        }
        .c2b{
            display: flex;
            flex: 1;
            justify-content: space-between;
        }
        p{
            margin: 0px;
            margin-bottom: 20px;
            background-color: black;
            color: white;
        }
    </style>
</head>
<body>
    <div class="row">
        <div class="c1"></div>
        <div class="c2">
            <div class="c2a">row1</div>
            <div class="c2b">
                <p>Row2</p>
                <p>Row2</p>
            </div>
        </div>
    </div>
</body>
</html>
